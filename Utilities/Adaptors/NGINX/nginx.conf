# Sample Nginx configuration for WebObjects Adaptor Module
# (ngx_http_webobjects_module)

# Load the dynamic module (adjust path to where the module was installed)
# load_module modules/ngx_http_webobjects_module.so;

worker_processes auto;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;

    # Define a thread pool to execute WebObjects transactions asynchronously
    # without blocking the Nginx event loop:
    thread_pool wo_pool threads=32 max_queue=65536;

    server {
        listen       80;
        server_name  localhost;

        # -------------------------------------------------------------
        # 1. Forward WebObjects application requests via the Adaptor
        # -------------------------------------------------------------
        location /cgi-bin/WebObjects {
            webobjects on;

            # Configuration source:
            # - From wotaskd: "http://127.0.0.1:1085,10" (checks every 10s)
            # - From local file: "file:///opt/Apple/Library/WebObjects/Configuration/WOConfig.xml,10"
            webobjects_config "http://127.0.0.1:1085,10";

            # WebObjects adaptor logging
            webobjects_log "/var/log/nginx/webobjects.log" info;

            # Offload blocking backend socket communication to Nginx thread pool
            webobjects_thread_pool wo_pool;

            # Client upload buffer limits
            client_max_body_size 100M;
            client_body_buffer_size 1M;
        }

        # -------------------------------------------------------------
        # 2. Serve static WebObjects framework / webserver resources
        #    directly from Nginx with maximum static caching performance!
        # -------------------------------------------------------------
        location /WebObjects {
            alias /opt/Apple/Library/WebObjects/WebServerResources;
            expires 30d;
            add_header Cache-Control "public, no-transform";
            access_log off;
        }

        # -------------------------------------------------------------
        # Error pages
        # -------------------------------------------------------------
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }
    }
}
